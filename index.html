<title>Forever Financial Trusted Agency | Service • Trust • Growth</title>
<style>
:root{--navy:#061b35;--navy2:#0b2a4d;--gold:#d6a62b;--gold2:#f5d36a;--white:#fff;--ink:#172033;--muted:#647084;--bg:#f5f7fb;--line:#e5e9f0;--card:#fff;--green:#18b76b;--shadow:0 12px 35px rgba(6,27,53,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}a{text-decoration:none;color:inherit}.wrap{width:min(1160px,calc(100% - 32px));margin:auto}
nav{position:sticky;top:0;z-index:50;background:rgba(6,27,53,.97);backdrop-filter:blur(12px);box-shadow:0 5px 24px #061b3520}.navin{height:70px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:850;font-size:15px;letter-spacing:.2px}.brandmark{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:grid;place-items:center;color:var(--navy);font-weight:950;font-size:18px;box-shadow:0 6px 18px #0003}.brand img{width:46px;height:46px;object-fit:contain}
.brand-logo{width:46px;height:46px;object-fit:contain;border-radius:50%;display:block}.about-full-logo{width:min(300px,90%);height:auto;display:block;margin:auto;object-fit:contain;border-radius:50%}
.links{display:flex;align-items:center;gap:24px;color:#eaf0f7;font-size:14px}.links a:hover{color:var(--gold2)}.navbtn{background:var(--gold);color:#071a33;padding:10px 15px;border-radius:9px;font-weight:800}
.hero{background:radial-gradient(circle at 85% 20%,#214e7b 0,transparent 32%),linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:72px 0 62px;overflow:hidden}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}.eyebrow{color:var(--gold2);font-weight:800;letter-spacing:1.7px;text-transform:uppercase;font-size:12px}.hero h1{font-size:clamp(40px,6vw,72px);line-height:1.02;letter-spacing:-2px;margin:12px 0 18px}.hero h1 span{color:var(--gold2)}.lead{font-size:18px;color:#dbe5f1;max-width:690px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#071a33;font-weight:850;box-shadow:0 10px 28px #0003;border:0;cursor:pointer}.btn.secondary{background:transparent;border:1px solid #ffffff55;color:#fff;box-shadow:none}.hero-art{min-height:370px;position:relative;display:grid;place-items:center}.orb{position:absolute;width:330px;height:330px;border:1px solid #ffffff24;border-radius:50%;box-shadow:inset 0 0 80px #ffffff0b,0 0 80px #0002}.orb:before,.orb:after{content:"";position:absolute;inset:28px;border:1px solid #d6a62b55;border-radius:50%}.orb:after{inset:80px}.biz-panel{position:relative;width:min(390px,90%);background:#ffffff12;border:1px solid #ffffff25;border-radius:26px;padding:25px;backdrop-filter:blur(12px);box-shadow:0 25px 70px #0004}.biz-head{display:flex;align-items:center;gap:13px;margin-bottom:20px}.biz-icon{width:52px;height:52px;border-radius:15px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:grid;place-items:center;color:var(--navy);font-weight:950;font-size:21px}.biz-title{font-weight:900;font-size:18px}.biz-sub{font-size:12px;color:#cbd8e6}.biz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.biz-item{padding:13px;border:1px solid #ffffff1e;border-radius:14px;background:#ffffff0b;font-size:12px;color:#dbe5f1}.biz-item b{display:block;color:#fff;font-size:13px;margin-bottom:3px}.biz-strip{margin-top:14px;padding:12px 14px;border-radius:12px;background:#061b35aa;color:var(--gold2);font-weight:800;text-align:center;font-size:12px}
.section{padding:72px 0}.section.alt{background:#fff}.head{text-align:center;max-width:760px;margin:0 auto 34px}.eyebrow.dark{color:#a07810}.head h2{font-size:clamp(30px,4vw,46px);margin:8px 0 10px;color:var(--navy)}.head p{color:var(--muted);margin:0}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.service{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:21px;display:flex;gap:14px;min-height:145px;box-shadow:0 7px 24px #0b2a4d0b;transition:.2s;cursor:pointer}.service:hover{transform:translateY(-3px);box-shadow:0 14px 30px #0b2a4d14;border-color:#d7b34e}.num{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:grid;place-items:center;color:var(--navy);font-weight:900}.service h3{margin:0 0 6px;color:var(--navy);font-size:17px}.service p{margin:0;color:var(--muted);font-size:13px}.service small{display:inline-block;margin-top:8px;color:#a07810;font-weight:800}
.about{display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;align-items:center}.about-logo{background:linear-gradient(145deg,var(--navy),#0e3157);border-radius:24px;padding:35px;text-align:center}.about-logo img{width:min(260px,80%);height:auto}.about-brandmark{width:86px;height:86px;margin:0 auto 18px;border-radius:24px;background:linear-gradient(145deg,var(--gold2),var(--gold));display:grid;place-items:center;color:var(--navy);font-size:34px;font-weight:950;box-shadow:0 14px 35px #0004}.about-brand-title{color:#fff;font-weight:950;font-size:20px;letter-spacing:.4px}.about-brand-sub{color:var(--gold2);font-weight:850;font-size:13px;letter-spacing:1.2px;margin-top:4px}.about-tag{margin-top:22px;padding:10px;border:1px solid #ffffff22;border-radius:10px;color:#dbe5f1;font-size:11px;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.badges{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.badge{border:1px solid #e3cc84;background:#fffaf0;color:#85620c;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700}.reg{margin-top:18px;padding:15px;border-left:4px solid var(--gold);background:#fffaf0;border-radius:8px}
.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.contact-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}.contact-card strong{display:block;color:var(--navy);margin-bottom:5px}.contact-card a{color:#a07810;font-weight:750;word-break:break-word}.cta{background:linear-gradient(135deg,var(--navy),#0b3158);color:#fff;border-radius:24px;padding:40px;text-align:center}.cta h2{margin:0 0 8px}.cta p{color:#dbe5f1;margin:0 0 20px}
footer{background:#041327;color:#aebccc;padding:28px 0 88px}.foot{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;font-size:13px}.wa{position:fixed;right:18px;bottom:18px;z-index:100;width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:25px;box-shadow:0 10px 28px #0004}.mobilebar{display:none}
.modal{position:fixed;inset:0;background:#061b3588;backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-box{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 30px 100px #0005}.modal-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center;position:sticky;top:0;background:#fff;z-index:2}.modal-head h3{margin:0;color:var(--navy)}.close{border:0;background:#eef2f7;border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer}.modal-body{padding:24px}.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.subcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;cursor:pointer;transition:.2s}.subcard:hover{border-color:#d7b34e;box-shadow:0 10px 24px #0b2a4d10;transform:translateY(-2px)}.subcard b{color:var(--navy);display:block;margin-bottom:5px;font-size:14px}.subcard:before{content:"↗";float:right;width:28px;height:28px;border-radius:9px;background:#fffaf0;color:#a07810;display:grid;place-items:center;font-weight:900}.subcard span{line-height:1.5}.subcard span{font-size:12px;color:var(--muted)}.sub-actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:800;font-size:12px;color:var(--navy);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d9e0e8;border-radius:10px;font:inherit;background:#fff}.field textarea{min-height:105px;resize:vertical}.full{grid-column:1/-1}.notice{background:#fffaf0;border-left:4px solid var(--gold);padding:12px 14px;border-radius:8px;color:#6e5616;font-size:13px;margin-bottom:16px}.back{border:0;background:none;color:#a07810;font-weight:850;cursor:pointer;padding:0}.listing-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.mini{padding:9px 12px;border-radius:9px;border:1px solid var(--line);font-weight:800;font-size:12px;cursor:pointer;background:#fff;color:var(--navy)}
@media(max-width:900px){.hero-grid,.about{grid-template-columns:1fr}.hero{text-align:center}.lead{margin:auto}.actions{justify-content:center}.services{grid-template-columns:1fr 1fr}.hero-art{order:-1}.subgrid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.wrap{width:min(100% - 22px,1160px)}.navin{height:62px}.brand{font-size:12px}.brandmark{width:40px;height:40px}.brand img{width:40px;height:40px}.brand-logo{width:40px;height:40px}.about-full-logo{width:min(250px,90%)}.links{display:none}.navbtn{padding:8px 10px;font-size:12px}.hero{padding:45px 0}.hero h1{font-size:42px;letter-spacing:-1.2px}.lead{font-size:16px}.section{padding:55px 0}.services,.contact,.subgrid{grid-template-columns:1fr}.about-logo{padding:25px}.card{padding:22px}.cta{padding:28px 18px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid var(--line);z-index:90}.mobilebar a{flex:1;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--navy)}.mobilebar a:last-child{background:var(--green);color:#fff}.wa{bottom:75px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.modal-body{padding:18px}}
</style>
